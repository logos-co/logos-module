e.nixos.org'...\ncopying path '/nix/store/lys9ksmh0a79blj1bd3d8y1a26ymmz7r-harfbuzz-11.2.1-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/0pr4q85wdnizd5rfvx1z9g16p6hvsmg1-icu4c-76.1-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/vx3hmjgdmhbbdmgd8xpgpx3d5zxp5cm0-lgx-lib-0.1.0' from 'https://logos-co.cachix.org'...\ncopying path '/nix/store/a9aq909fc6ymnawnk877qcs4gklzm1c1-qtbase-6.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/mv13bxmzlh71mixcvf662ah5l00ijyci-cups-2.4.12-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/4xhd29q8lnrka0cx3bm6qppnlbjvhbar-python3.13-packaging-25.0' from 'https://cache.nixos.org'...\ncopying path '/nix/store/9nnmji4039hnrb9fgqj5q9qjmyafhy80-glib-2.84.4-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/5s3wm6gxm3bi1zykwklx6c9b9ag54ry6-qtbase-6.9.2-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/n9w4rvalqxk7anhbc4h0wgj0szf7773x-clang-19.1.7-lib' from 'https://cache.nixos.org'...\ncopying path '/nix/store/6x0pcc2q0hmzac95h8p7frwdxn59iwq6-ld64-954.16' from 'https://cache.nixos.org'...\ncopying path '/nix/store/6hl85jp06hsq7jwrhk1zfbsjfb6dd589-llvm-19.1.7' from 'https://cache.nixos.org'...\ncopying path '/nix/store/d7b7ms0zqg4ncv2gp26kss9frcg99nz2-cctools-1010.6-libtool' from 'https://cache.nixos.org'...\ncopying path '/nix/store/rh7pmsjn8q2hgfnc77f2hn33k03bva79-cctools-1010.6' from 'https://cache.nixos.org'...\ncopying path '/nix/store/50cb6vjpl9drrqmi72s6w5rbhfr6phkl-clang-19.1.7' from 'https://cache.nixos.org'...\ncopying path '/nix/store/y7sd8l0kx34yply8v0x8ly9zxpf97798-cctools-binutils-darwin-1010.6' from 'https://cache.nixos.org'...\ncopying path '/nix/store/rhlyld20zdzdi5wghb4b12gw52s9whr9-apple-sdk-11.3' from 'https://cache.nixos.org'...\ncopying path '/nix/store/y9wq3jvp6qqgy9x3k4nb2rzpgz34l2ya-cctools-binutils-darwin-wrapper-1010.6' from 'https://cache.nixos.org'...\ncopying path '/nix/store/zzx6cfl99zknfrj9v7lmrshwzslfjv26-clang-wrapper-19.1.7' from 'https://cache.nixos.org'...\ncopying path '/nix/store/pgrkqlci4gld1kp0qdhjzp1zazxblj2b-stdenv-darwin' from 'https://cache.nixos.org'...\nbuilding '/nix/store/5pbpdv53rg8949l6ysxfwkg4p5h00lxy-logos-module-cli-0.1.0.drv'...\n", "status": "pass"}], "md": "### 1.1 Build lm\n\n```bash\n# From inside the clone this is simply: nix build '.#lm' -o lm\nnix build 'github:logos-co/logos-module/eb7b3713e0f80c06313567363e22dd9a86d70814#lm' -o lm\n```"}, {"execs": [{"cmd": "./lm/bin/lm --version", "exit_code": 0, "kind": "run", "note": "", "output": "lm (Logos Module) version 0.1.0\n", "status": "pass"}], "md": "### 1.2 Confirm it runs\n\n```bash\n./lm/bin/lm --version\n```"}, {"execs": [], "md": "## Step 2: Build a module to inspect\n\n`lm` reads modules, so we need one. A Logos module is a **Qt plugin**: a shared\nlibrary holding one `QObject` class, with two things that matter to an inspector.\n\n- `Q_PLUGIN_METADATA(IID \u2026 FILE \"greeter.json\")` embeds that JSON file into the\n  binary as a data section. That section \u2014 not the filename, not anything on disk\n  beside it \u2014 is what `lm metadata` prints.\n- every `Q_INVOKABLE` method is registered in Qt's meta-object, and that registry is\n  what `lm methods` lists. It is also exactly the set of methods other modules can\n  call over the Logos runtime, which is why \"what does `lm methods` say\" is the same\n  question as \"what is this module's API\".\n\nThree files \u2014 write each one into the working directory as it appears below \u2014 and\nthen one build. We compile inside this repository's own dev shell, so the Qt it links\nis the Qt `lm` was built against, and the plugin is native to whichever machine is\nrunning this \u2014 no pre-compiled binary that only loads on one of them."}, {"execs": [{"cmd": "write greeter.json", "kind": "file", "note": "Wrote greeter.json", "status": "pass"}], "md": "### 2.1 The embedded metadata\n\n`greeter.json` is the module's identity card. Note the two shapes a dependency\ntakes: a bare name declares the edge and constrains nothing, while the object\nform additionally says which versions will do.\n\n```json\n{\n  \"name\": \"greeter\",\n  \"display_name\": \"Greeter\",\n  \"version\": \"1.2.0\",\n  \"description\": \"A minimal Logos module, built to be inspected.\",\n  \"author\": \"Logos\",\n  \"type\": \"core\",\n  \"logos_protocol_version\": \"0.6.0\",\n  \"dependencies\": [\n    \"storage_module\",\n    { \"name\": \"chat_module\", \"version\": \">=2.0.0\" }\n  ]\n}\n```"}, {"execs": [{"cmd": "write greeter_plugin.h", "kind": "file", "note": "Wrote greeter_plugin.h", "status": "pass"}], "md": "### 2.2 The plugin class\n\n`greeter_plugin.h`, beside it. Two `Q_INVOKABLE` methods, which is the whole\npublic API of this module.\n\n```cpp\n#pragma once\n#include <QObject>\n#include <QtPlugin>\n#include <QString>\n\nclass GreeterPlugin : public QObject\n{\n    Q_OBJECT\n    Q_PLUGIN_METADATA(IID \"com.example.PluginInterface\" FILE \"greeter.json\")\n\npublic:\n    Q_INVOKABLE QString name() const { return QStringLiteral(\"greeter\"); }\n\n    Q_INVOKABLE QString greet(const QString& who) const {\n        return QStringLiteral(\"hello, \") + who;\n    }\n};\n```"}, {"execs": [{"cmd": "write CMakeLists.txt", "kind": "file", "note": "Wrote CMakeLists.txt", "status": "pass"}], "md": "### 2.3 The build\n\nAnd `CMakeLists.txt`, the third and last file in the directory.\n\n`MODULE` is CMake's word for a library that is only ever `dlopen`ed, never linked\nagainst \u2014 which is what a plugin is. `SUFFIX` names it the way this platform\nnames shared libraries, `.so` on Linux and `.dylib` on macOS, because a real\nmodule's `manifest.json` will name it that way too.\n\n```\ncmake_minimum_required(VERSION 3.16)\nproject(greeter LANGUAGES CXX)\nset(CMAKE_CXX_STANDARD 17)\n\nfind_package(Qt6 REQUIRED COMPONENTS Core)\n\nadd_library(greeter_plugin MODULE greeter_plugin.h)\nset_target_properties(greeter_plugin PROPERTIES\n    AUTOMOC ON\n    PREFIX \"\"\n    SUFFIX \".${LOGOS_MODULE_EXT}\")\ntarget_link_libraries(greeter_plugin PRIVATE Qt6::Core)\n```"}, {"execs": [{"cmd": "nix develop 'github:logos-co/logos-module/eb7b3713e0f80c06313567363e22dd9a86d70814' --command bash -c 'cmake -S . -B build -DLOGOS_MODULE_EXT=dylib >/dev/null && cmake --build build >/dev/null'\ntest -f build/greeter_plugin.dylib && echo \"plugin built\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "copying path '/nix/store/cia9l80dlfiw8a23pssk77sr31gl1qxk-nix-shell-env' from 'https://logos-co.cachix.org'...\nthese 2 paths will be fetched (1.1 MiB download, 8.2 MiB unpacked):\n  /nix/store/dgfikfjky3nq6gycpd08fyvmr7ww1j7j-bash-interactive-5.3p3\n  /nix/store/f3rz4yan99jnnwcpfw8117ayf37fzxgl-bash-interactive-5.3p3-man\ncopying path '/nix/store/f3rz4yan99jnnwcpfw8117ayf37fzxgl-bash-interactive-5.3p3-man' from 'https://cache.nixos.org'...\ncopying path '/nix/store/dgfikfjky3nq6gycpd08fyvmr7ww1j7j-bash-interactive-5.3p3' from 'https://cache.nixos.org'...\nLogos Module development environment\nBuild with tests: cmake -B build -DLOGOS_MODULE_BUILD_TESTS=ON && cmake --build build\nRun tests: cd build && ctest --output-on-failure\nld: warning: dylib (/nix/store/a9aq909fc6ymnawnk877qcs4gklzm1c1-qtbase-6.9.2/lib/QtCore.framework/Versions/A/QtCore) was built for newer macOS version (12.0) than being linked (11.3)\nplugin built\n", "status": "pass"}], "md": "### 2.4 Compile the plugin\n\n`nix develop` on this same repository puts CMake and the matching Qt on `PATH`.\nThe assertion is on a sentence the shell prints, not on the file name, since that\nname differs per platform.\n\n```bash\n# {ext} is `so` on Linux, `dylib` on macOS.\nnix develop 'github:logos-co/logos-module/eb7b3713e0f80c06313567363e22dd9a86d70814' --command bash -c \\\n  'cmake -S . -B build -DLOGOS_MODULE_EXT=so >/dev/null && cmake --build build >/dev/null'\n```"}, {"execs": [], "md": "## Step 3: Read a plugin file\n\nThis is `lm`'s oldest job: point it at a compiled plugin and it tells you what the\nplugin says about itself. Nothing else is consulted \u2014 no manifest, no package, no\nruntime."}, {"execs": [{"cmd": "./lm/bin/lm metadata build/greeter_plugin.dylib", "exit_code": 0, "kind": "run", "note": "", "output": "Plugin Metadata:\n================\nName:         greeter\nDisplay name: Greeter\nVersion:      1.2.0\nDescription:  A minimal Logos module, built to be inspected.\nAuthor:       Logos\nType:         core\nProtocol:     0.6.0\nDependencies: storage_module, chat_module\n", "status": "pass"}], "md": "### 3.1 lm metadata \u2014 the embedded identity card\n\nEvery line here came out of `greeter.json` as it was compiled in. `Protocol:` is\nthe logos-protocol version the module was built against, the one number that\ngoverns whether a host can load and call it; a module from a pre-protocol builder\nhas no stamp and says so. Both dependency forms are listed by name \u2014 the object\nform is not a different edge, just a constrained one.\n\n```bash\nlm metadata build/greeter_plugin.so\n```"}, {"execs": [{"cmd": "./lm/bin/lm methods build/greeter_plugin.dylib", "exit_code": 0, "kind": "run", "note": "", "output": "Plugin Methods:\n===============\n\nQString name()\n  Signature: name()\n  Invokable: yes\n\nQString greet(QString who)\n  Signature: greet(QString)\n  Invokable: yes\n\n", "status": "pass"}], "md": "### 3.2 lm methods \u2014 the module's API\n\nRead out of Qt's meta-object, so it is the real callable surface rather than\nanything a document claims. `Signature:` is the normalised form the runtime\ndispatches on.\n\n```bash\nlm methods build/greeter_plugin.so\n```"}, {"execs": [{"cmd": "./lm/bin/lm events build/greeter_plugin.dylib", "exit_code": 0, "kind": "run", "note": "", "output": "Plugin Events:\n==============\n\n(no events found)\n", "status": "pass"}], "md": "### 3.3 lm events \u2014 and why this one has none\n\nEvents are the fire-and-forget half of a module's interface, declared by\nuniversal modules in their `logos_events:` section and rendered with a `void`\nreturn. A hand-written Qt plugin like ours declares none, and `lm` says so rather\nthan failing \u2014 \"no events\" is an answer, not an error.\n\n```bash\nlm events build/greeter_plugin.so\n```"}, {"execs": [{"cmd": "./lm/bin/lm metadata build/greeter_plugin.dylib --json > meta.json\ngrep -q '\"logos_protocol_version\": \"0.6.0\"' meta.json && echo \"protocol stamp carried into JSON\"\ngrep -q module_directory meta.json \\\n  && echo \"install report present\" \\\n  || echo \"no install report: a plugin file has no manifest to report\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "protocol stamp carried into JSON\nno install report: a plugin file has no manifest to report\n", "status": "pass"}], "md": "### 3.4 The JSON shape, and what is missing from it\n\n`--json` gives the same facts to a script. The interesting part is the key that\nis *not* there: `module_directory` describes an install, and a bare plugin file\nhas no manifest, no signature and no variant to describe. The key is absent\nrather than empty, so a parser can never mistake one for the other.\n\n```bash\nlm metadata build/greeter_plugin.so --json > meta.json\ngrep -q module_directory meta.json && echo \"install report present\" \\\n                                   || echo \"no install report: a plugin file has no manifest to report\"\n```"}, {"execs": [], "md": "## Step 4: Install it into a module directory\n\nNow the other shape. When a package manager installs a module it does not leave you a\nsingle file \u2014 it leaves a **directory**, and that directory *is* the module:\n\n```\nmodules/greeter/\n  manifest.json          # who this is, and which file is the plugin\n  greeter_plugin.so      # the payload, .dylib on macOS\n  variant                # which platform's build was installed here\n```\n\n`main` in the manifest is a map keyed by **variant** \u2014 one package can carry a build\nfor every platform, and only one of them was extracted here. The `variant` file\nrecords which, so `lm` knows which key to read. Point `lm` at the directory and it\nresolves that chain for you."}, {"execs": [{"cmd": "case \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   V=linux-x86_64 ;;\n  \"Linux aarch64\")  V=linux-arm64 ;;\n  \"Darwin arm64\")   V=darwin-arm64 ;;\n  \"Darwin x86_64\")  V=darwin-x86_64 ;;\n  *) echo \"unsupported platform: $(uname -sm)\" >&2; exit 1 ;;\nesac\necho \"$V\" > variant.txt\nmkdir -p modules/greeter\ncp build/greeter_plugin.dylib modules/greeter/\ncat > modules/greeter/manifest.json <<EOF\n{\n  \"author\": \"Logos\",\n  \"category\": \"\",\n  \"dependencies\": [],\n  \"description\": \"A minimal Logos module, built to be inspected.\",\n  \"icon\": \"\",\n  \"main\": { \"$V\": \"greeter_plugin.dylib\" },\n  \"manifestVersion\": \"0.5.0\",\n  \"name\": \"greeter\",\n  \"type\": \"core\",\n  \"version\": \"1.2.0\"\n}\nEOF\necho \"$V\" > modules/greeter/variant\n# Guarded: an unconditional echo would keep this step green even if\n# the assembly above had failed.\ntest -f modules/greeter/manifest.json && test -f modules/greeter/variant \\\n  && echo \"installed greeter for variant $V\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "installed greeter for variant darwin-arm64\n", "status": "pass"}], "md": "### 4.1 Assemble the directory\n\nDetect this machine's variant, then write the manifest and the `variant` file\naround the plugin we compiled.\n\n```bash\ncase \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   V=linux-x86_64 ;;\n  \"Linux aarch64\")  V=linux-arm64 ;;\n  \"Darwin arm64\")   V=darwin-arm64 ;;\n  \"Darwin x86_64\")  V=darwin-x86_64 ;;\nesac\necho \"$V\" > variant.txt          # the later steps re-read this\n\nmkdir -p modules/greeter\ncp build/greeter_plugin.so modules/greeter/\ncat > modules/greeter/manifest.json <<EOF\n{\n  \"author\": \"Logos\",\n  \"category\": \"\",\n  \"dependencies\": [],\n  \"description\": \"A minimal Logos module, built to be inspected.\",\n  \"icon\": \"\",\n  \"main\": { \"$V\": \"greeter_plugin.so\" },\n  \"manifestVersion\": \"0.5.0\",\n  \"name\": \"greeter\",\n  \"type\": \"core\",\n  \"version\": \"1.2.0\"\n}\nEOF\necho \"$V\" > modules/greeter/variant\n```"}, {"execs": [{"cmd": "./lm/bin/lm modules/greeter", "exit_code": 0, "kind": "run", "note": "", "output": "Module Directory:\n=================\nPath:         /private/tmp/doctest-test-ztslxb2_/modules/greeter\nType:         core\nManifest:     manifest.json (290 bytes)\nSignature:    (none \u2014 package is unsigned)\nVariant:      darwin-arm64\nMain:         greeter_plugin.dylib  [main.darwin-arm64]\nPayload:      1 file(s)\n  greeter_plugin.dylib\n\nPlugin Metadata:\n================\nName:         greeter\nDisplay name: Greeter\nVersion:      1.2.0\nDescription:  A minimal Logos module, built to be inspected.\nAuthor:       Logos\nType:         core\nProtocol:     0.6.0\nDependencies: storage_module, chat_module\n\nPlugin Methods:\n===============\n\nQString name()\n  Signature: name()\n  Invokable: yes\n\nQString greet(QString who)\n  Signature: greet(QString)\n  Invokable: yes\n\n\nPlugin Events:\n==============\n\n(no events found)\n", "status": "pass"}], "md": "### 4.2 Read the directory\n\nOne report, then the same three sections a plugin file would have given \u2014\nbecause after resolving `main`, that is exactly what `lm` is looking at. Note\nthat `Main:` shows *which* variant key answered, so a package installed for the\nwrong platform is visible at a glance.\n\n```bash\nlm modules/greeter\n```"}, {"execs": [{"cmd": "V=\"$(cat variant.txt)\"\n./lm/bin/lm modules/greeter --json > install.json\ngrep -q \"\\\"variant\\\": \\\"$V\\\"\" install.json && echo \"main resolved through main[$V]\"\ngrep -q '\"plugin\": \"present\"' install.json && echo \"plugin: present\"\ngrep -q '\"name_agreement\": \"agree\"' install.json && echo \"manifest name and plugin name agree\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "main resolved through main[darwin-arm64]\nplugin: present\nmanifest name and plugin name agree\n", "status": "pass"}], "md": "### 4.3 The install in JSON\n\nFor a directory, the `module_directory` object is added to the JSON that a plugin\nfile's `--json` did not have. Two of its fields are worth knowing about:\n`plugin` is `lm`'s verdict on whether a plugin was expected at all, and\n`name_agreement` compares the name in `manifest.json` against the name compiled\ninto the plugin \u2014 a directory that ships one module under another module's name\nis exactly the shape you want a tool to notice for you.\n\n```bash\nlm modules/greeter --json > install.json\ngrep '\"plugin\"\\|\"name_agreement\"' install.json\n```"}, {"execs": [], "md": "## Step 5: A UI package with no plugin at all\n\nA `ui_qml` package is a module directory too, and `lm` reads it the same way \u2014 but it\nmay legitimately contain no compiled code whatsoever. A view-only UI is QML plus its\nassets; there is nothing to `dlopen`, and a `manifest.json` with no `main` is\ntherefore **complete**, not broken, as long as it says what to render instead.\n\nThis is the one distinction worth carrying away from this doc-test: *the same missing\nfield means different things depending on the package's type.* `lm` reports the\nabsence and exits `0`, so a script that installs UI packages does not have to treat\nevery one of them as a failure."}, {"execs": [{"cmd": "V=\"$(cat variant.txt)\"\nmkdir -p plugins/greeter_ui/qml plugins/greeter_ui/assets\nprintf 'import QtQuick\\nItem {}\\n' > plugins/greeter_ui/qml/Main.qml\nprintf 'not really a png\\n' > plugins/greeter_ui/assets/icon.png\ncat > plugins/greeter_ui/manifest.json <<'EOF'\n{\n  \"author\": \"Logos\",\n  \"category\": \"\",\n  \"dependencies\": [],\n  \"description\": \"A ui_qml package that is QML only.\",\n  \"icon\": \"assets/icon.png\",\n  \"manifestVersion\": \"0.5.0\",\n  \"name\": \"greeter_ui\",\n  \"type\": \"ui_qml\",\n  \"version\": \"1.2.0\",\n  \"view\": \"qml/Main.qml\"\n}\nEOF\necho \"$V\" > plugins/greeter_ui/variant\ntest -f plugins/greeter_ui/manifest.json && test -f plugins/greeter_ui/qml/Main.qml \\\n  && echo \"assembled greeter_ui\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "assembled greeter_ui\n", "status": "pass"}], "md": "### 5.1 Assemble a QML-only ui_qml package\n\n```bash\nV=\"$(cat variant.txt)\"\nmkdir -p plugins/greeter_ui/qml plugins/greeter_ui/assets\nprintf 'import QtQuick\\nItem {}\\n' > plugins/greeter_ui/qml/Main.qml\nprintf 'not really a png\\n' > plugins/greeter_ui/assets/icon.png\ncat > plugins/greeter_ui/manifest.json <<'EOF'\n{\n  \"author\": \"Logos\",\n  \"category\": \"\",\n  \"dependencies\": [],\n  \"description\": \"A ui_qml package that is QML only.\",\n  \"icon\": \"assets/icon.png\",\n  \"manifestVersion\": \"0.5.0\",\n  \"name\": \"greeter_ui\",\n  \"type\": \"ui_qml\",\n  \"version\": \"1.2.0\",\n  \"view\": \"qml/Main.qml\"\n}\nEOF\necho \"$V\" > plugins/greeter_ui/variant\ntest -f plugins/greeter_ui/manifest.json && test -f plugins/greeter_ui/qml/Main.qml \\\n  && echo \"assembled greeter_ui\"\n\n```"}, {"execs": [{"cmd": "./lm/bin/lm plugins/greeter_ui\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Module Directory:\n=================\nPath:         /private/tmp/doctest-test-ztslxb2_/plugins/greeter_ui\nType:         ui_qml  (UI plugin)\nManifest:     manifest.json (270 bytes)\nSignature:    (none \u2014 package is unsigned)\nVariant:      darwin-arm64\nMain:         (none \u2014 this ui_qml package is QML only)\nView:         qml/Main.qml\nIcon:         assets/icon.png\nPayload:      2 file(s)\n  assets\n  qml\n\n(no plugin \u2014 this ui_qml package is QML only)\nexit: 0\n", "status": "pass"}], "md": "### 5.2 lm reports the absence and succeeds\n\n`View:` and `Icon:` appear because the manifest declares them, and `lm` checks\nthat both actually resolve inside the directory \u2014 the next step is what that\ncheck looks like when one of them does not.\n\n```bash\nlm plugins/greeter_ui\n```"}, {"execs": [{"cmd": "./lm/bin/lm plugins/greeter_ui --json | grep '\"plugin\"'\n./lm/bin/lm methods plugins/greeter_ui --json\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "        \"plugin\": \"not_expected\",\n[\n]\nexit: 0\n", "status": "pass"}], "md": "### 5.3 The plugin commands succeed too\n\n`methods` on a package with no plugin returns an empty list, not an error, and\nstill a bare JSON array \u2014 a parser reading `lm methods --json` never has to\nspecial-case the one package type with nothing to list. `plugin: not_expected` in\nthe directory report is the field that distinguishes this from a module whose\nplugin is genuinely missing.\n\n```bash\nlm plugins/greeter_ui --json | grep '\"plugin\"'\nlm methods plugins/greeter_ui --json\n```"}, {"execs": [{"cmd": "cp -R plugins/greeter_ui plugins/dangling_view\nrm plugins/dangling_view/qml/Main.qml\n./lm/bin/lm plugins/dangling_view > report.txt\necho \"exit: $?\"\ngrep \"^View:\" report.txt\n./lm/bin/lm plugins/dangling_view --json | grep -A3 '\"view\"'\n", "exit_code": 0, "kind": "run", "note": "", "output": "exit: 0\nView:         qml/Main.qml  MISSING \u2014 not in this directory\n                \"view\": \"qml/Main.qml\"\n            },\n            \"size_bytes\": 270\n        },\n--\n        \"view\": {\n            \"declared\": \"qml/Main.qml\",\n            \"state\": \"file_missing\"\n        }\n", "status": "pass"}], "md": "### 5.4 A view that was never extracted\n\n`view` is a path into the directory, so it can dangle exactly the way `main` can.\n`lm` says so on the `View:` line rather than anywhere else, and still exits `0`:\na package whose QML is missing is a broken *install*, not a malformed manifest,\nand the two are different repairs. `--json` carries the same verdict as\n`view.state` for whatever is doing the installing.\n\n```bash\ncp -R plugins/greeter_ui plugins/dangling_view\nrm plugins/dangling_view/qml/Main.qml\nlm plugins/dangling_view\n```"}, {"execs": [], "md": "## Step 6: When a directory cannot name a plugin\n\nFour different things can go wrong between \"there is a directory\" and \"here is the\nplugin\", and they need four different repairs. `lm` names the actual fault in each\ncase, because *not found* would tell whoever hit it nothing they could act on. Each\none exits `1`."}, {"execs": [{"cmd": "mkdir -p broken/no_manifest\ncp build/greeter_plugin.dylib broken/no_manifest/\n./lm/bin/lm broken/no_manifest\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Error: no manifest.json in module directory: /private/tmp/doctest-test-ztslxb2_/broken/no_manifest\n  A module directory is identified by its manifest. To inspect a bare\n  plugin, pass the plugin file itself.\nexit: 1\n", "status": "pass"}], "md": "### 6.1 1. No manifest.json\n\nA module directory is *identified* by its manifest. Without one there is nothing\nto say the directory is a module at all, so `lm` points you back at the file.\n\n```bash\nmkdir -p broken/no_manifest\ncp build/greeter_plugin.so broken/no_manifest/\nlm broken/no_manifest\n```"}, {"execs": [{"cmd": "mkdir -p broken/no_main\ncp build/greeter_plugin.dylib broken/no_main/\ngrep -v '\"main\"' modules/greeter/manifest.json > broken/no_main/manifest.json\ncp modules/greeter/variant broken/no_main/\n./lm/bin/lm broken/no_main\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Error: manifest.json declares no \"main\": /private/tmp/doctest-test-ztslxb2_/broken/no_main/manifest.json\n  Nothing in this directory is named as the module's plugin.\nexit: 1\n", "status": "pass"}], "md": "### 6.2 2. A manifest with no \"main\"\n\nTake the good manifest and delete the one line that names the plugin. Here is the\ncontrast with the QML-only package above: the same field is absent, but this\nmanifest says `\"type\": \"core\"`, and a core module is *only* its plugin. Nothing in\nthe directory is named as the thing to load, so there is nothing to run \u2014 and `lm`\nsays that rather than pointing at `view`.\n\n```bash\nmkdir -p broken/no_main\ncp build/greeter_plugin.so broken/no_main/\ngrep -v '\"main\"' modules/greeter/manifest.json > broken/no_main/manifest.json\ncp modules/greeter/variant broken/no_main/\nlm broken/no_main\n```"}, {"execs": [{"cmd": "mkdir -p broken/ui_no_view\nsed 's/\"type\": \"core\"/\"type\": \"ui_qml\"/' broken/no_main/manifest.json \\\n  > broken/ui_no_view/manifest.json\ncp modules/greeter/variant broken/ui_no_view/\n./lm/bin/lm broken/ui_no_view\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Error: manifest.json declares no \"main\": /private/tmp/doctest-test-ztslxb2_/broken/ui_no_view/manifest.json\n  A ui_qml package with no \"main\" must declare a \"view\".\nexit: 1\n", "status": "pass"}], "md": "### 6.3 2b. The same omission in a ui_qml package\n\nChange one field \u2014 the type \u2014 and the verdict changes with it. A `ui_qml` package\nis allowed to have no `main`, but only when it declares a `view` to render\ninstead; with neither, there is genuinely nothing here to run, and the message\nnames the field that would make it whole.\n\n```bash\nmkdir -p broken/ui_no_view\nsed 's/\"type\": \"core\"/\"type\": \"ui_qml\"/' broken/no_main/manifest.json \\\n  > broken/ui_no_view/manifest.json\ncp modules/greeter/variant broken/ui_no_view/\nlm broken/ui_no_view\n```"}, {"execs": [{"cmd": "mkdir -p broken/missing_file\ncp modules/greeter/manifest.json modules/greeter/variant broken/missing_file/\n./lm/bin/lm broken/missing_file\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Error: manifest.json names a main that is not in the module directory: /private/tmp/doctest-test-ztslxb2_/broken/missing_file\n  main[darwin-arm64] = greeter_plugin.dylib\n  The package was installed for another variant, or extraction was partial.\nexit: 1\n", "status": "pass"}], "md": "### 6.4 3. A \"main\" naming a file that is not there\n\nThe manifest is fine and the variant matched; the file it points at simply is not\nin the directory. That is an installation fault rather than a packaging one, so\nthe message names the two ways it happens.\n\n```bash\n# the good manifest and variant, in a directory whose payload was never extracted\nmkdir -p broken/missing_file\ncp modules/greeter/manifest.json modules/greeter/variant broken/missing_file/\nlm broken/missing_file\n```"}, {"execs": [{"cmd": "mkdir -p broken/wrong_variant\ncp build/greeter_plugin.dylib broken/wrong_variant/\nsed 's/\"main\": {[^}]*}/\"main\": { \"aix-ppc64\": \"greeter_plugin.a\" }/' \\\n  modules/greeter/manifest.json > broken/wrong_variant/manifest.json\ncp modules/greeter/variant broken/wrong_variant/\n./lm/bin/lm broken/wrong_variant\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Error: manifest.json declares no main for this variant: /private/tmp/doctest-test-ztslxb2_/broken/wrong_variant/manifest.json\n  main has: aix-ppc64\n  tried:    darwin-arm64\nexit: 1\n", "status": "pass"}], "md": "### 6.5 4. A \"main\" with no entry for this variant\n\nThe package is intact \u2014 it just does not carry a build for the platform it was\ninstalled on. `lm` prints both sides of the mismatch: the variants `main` offers,\nand the ones it tried.\n\n```bash\nmkdir -p broken/wrong_variant\ncp build/greeter_plugin.so broken/wrong_variant/\nsed 's/\"main\": {[^}]*}/\"main\": { \"aix-ppc64\": \"greeter_plugin.a\" }/' \\\n  modules/greeter/manifest.json > broken/wrong_variant/manifest.json\ncp modules/greeter/variant broken/wrong_variant/\nlm broken/wrong_variant\n```"}, {"execs": [{"cmd": "rm broken/wrong_variant/variant\n./lm/bin/lm broken/wrong_variant\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Error: manifest.json declares no main for this variant: /private/tmp/doctest-test-ztslxb2_/broken/wrong_variant/manifest.json\n  main has: aix-ppc64\n  tried:    (nothing \u2014 no `variant` file here; pass --variant <name>)\nexit: 1\n", "status": "pass"}], "md": "### 6.6 4b. \u2026and with no variant file to go on\n\nDelete the `variant` file and `lm` has nothing to match against at all. Rather\nthan guessing this machine's platform and reporting a mismatch it never actually\ntested, it says the list it tried was empty and names the flag that fills it in.\n\n```bash\nrm broken/wrong_variant/variant\nlm broken/wrong_variant\n```"}, {"execs": [], "md": "## Step 7: Choosing the variant yourself\n\n`--variant` supplies what the `variant` file would have. It is the answer to the\nprevious failure, and it is also how you inspect a package for a platform you are not\non. It only makes sense for a directory, so `lm` refuses it on a plugin file rather\nthan silently ignoring it."}, {"execs": [{"cmd": "V=\"$(cat variant.txt)\"\ncp -R modules/greeter broken/no_variant_file\nrm broken/no_variant_file/variant\n./lm/bin/lm metadata broken/no_variant_file\necho \"without --variant, exit: $?\"\n./lm/bin/lm metadata broken/no_variant_file --variant \"$V\"\necho \"with --variant, exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Error: manifest.json declares no main for this variant: /private/tmp/doctest-test-ztslxb2_/broken/no_variant_file/manifest.json\n  main has: darwin-arm64\n  tried:    (nothing \u2014 no `variant` file here; pass --variant <name>)\nwithout --variant, exit: 1\nModule Directory:\n=================\nPath:         /private/tmp/doctest-test-ztslxb2_/broken/no_variant_file\nType:         core\nManifest:     manifest.json (290 bytes)\nSignature:    (none \u2014 package is unsigned)\nVariant:      (no variant file)\nMain:         greeter_plugin.dylib  [main.darwin-arm64]\nPayload:      1 file(s)\n  greeter_plugin.dylib\n\nPlugin Metadata:\n================\nName:         greeter\nDisplay name: Greeter\nVersion:      1.2.0\nDescription:  A minimal Logos module, built to be inspected.\nAuthor:       Logos\nType:         core\nProtocol:     0.6.0\nDependencies: storage_module, chat_module\nwith --variant, exit: 0\n", "status": "pass"}], "md": "### 7.1 A directory with no variant file, recovered\n\n```bash\ncp -R modules/greeter broken/no_variant_file\nrm broken/no_variant_file/variant\nlm metadata broken/no_variant_file    # fails: nothing to match\nlm metadata broken/no_variant_file --variant \"$(cat variant.txt)\"\n```"}, {"execs": [{"cmd": "./lm/bin/lm metadata build/greeter_plugin.dylib --variant linux-x86_64\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Error: --variant selects a main from a module directory's manifest.json; build/greeter_plugin.dylib is a plugin file\nexit: 1\n", "status": "pass"}], "md": "### 7.2 Refused on a plugin file\n\nThere is no manifest in a `.so` to select a `main` out of, so the flag has no\nmeaning here and `lm` says which of the two shapes it was handed.\n\n```bash\nlm metadata build/greeter_plugin.so --variant linux-x86_64\n```"}, {"execs": [], "md": "## Step 8: What a hand-made directory cannot prove\n\nEverything above was about *reading*. `lm verify` asks the other question \u2014 is this\ninstall intact, and who signed it? \u2014 and our directory cannot answer it: we wrote the\nmanifest ourselves, so it carries no content hashes for anything to be checked\nagainst. `lm` reports that as *not proved* rather than as a pass, and fails.\n\nReal hashes come from the packaging step. The companion\n[verification doc-test](lm-verify.md) builds a genuine signed `.lgx`, installs it,\nand takes `verify` through integrity, signer pinning and tampering."}, {"execs": [{"cmd": "./lm/bin/lm verify modules/greeter\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Verification:\n=============\nPath:       /private/tmp/doctest-test-ztslxb2_/modules/greeter\nVariant:    darwin-arm64\nIntegrity:  not proved \u2014 Missing 'variants/darwin-arm64' hash in manifest\nSignature:  not checked \u2014 this package is unsigned\nFindings:   1\n  - Missing 'variants/darwin-arm64' hash in manifest\n\nRESULT: FAIL\nexit: 1\n", "status": "pass"}], "md": "### 8.1 Verify the hand-made install\n\n```bash\nlm verify modules/greeter\n```"}, {"execs": [], "md": "## Recap\n\nYou built `lm` from this commit, compiled a real Logos module plugin, and read it\nboth ways \u2014 as a file and as the directory it gets installed into:\n\n| Command | On a plugin file | On a module directory |\n|---|---|---|\n| `lm <path>` | metadata + methods + events | the install report, then the same three |\n| `lm metadata <path>` | the embedded identity card | plus `module_directory` under `--json` |\n| `lm methods <path>` | the `Q_INVOKABLE` surface | the same, for the plugin `main` names |\n| `lm events <path>` | declared events, or none | the same |\n| `lm verify <path>` | refused \u2014 a file has no manifest | integrity + signature ([see the verify doc-test](lm-verify.md)) |\n| `--variant <name>` | refused \u2014 nothing to select from | supplies what the `variant` file would have |\n\nAnd the four ways a directory can fail to name a plugin, each with its own repair:\n\n| `lm` says | What to fix |\n|---|---|\n| `no manifest.json in module directory` | you passed a directory that is not an install |\n| `manifest.json declares no \"main\"` | the package names nothing to load (or, for `ui_qml`, no `view` either) |\n| `names a main that is not in the module directory` | extraction was partial, or was for another variant |\n| `declares no main for this variant` | the package carries no build for this platform |\n\nThe one that is *not* a failure: a `ui_qml` package with a `view` and no `main` is\nQML only, and `lm` reports the absent plugin and exits `0`. A `view` that names a file\nnobody extracted is not one either \u2014 it is reported as `MISSING` on the `View:` line,\nand still exits `0`, because a half-extracted install and a malformed manifest are\ndifferent things to go and fix."}]}, {"meta": {"name": "Verifying an Installed Module Directory", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Verifying an Installed Module Directory\n\nReading a module tells you what it *says* it is. `lm verify` asks the other question: is\nthis install still the one that was published, and **whose** is it?\n\nA module reaches a machine as an `.lgx` package \u2014 a signed archive \u2014 and is unpacked into\na directory. The package's guarantees have to survive that unpacking, and two of them do:\n\n- the manifest carries **content hashes** over the files it covers, so the payload on\n  disk can be checked against what was published;\n- a `manifest.sig` beside it carries an **Ed25519 signature** over the manifest's exact\n  bytes.\n\n`lm verify` runs those checks \u2014 they are\n[logos-package](https://github.com/logos-co/logos-package)'s own, the same rules `lgx\nverify` applies to the archive the directory came out of \u2014 and exits non-zero when one\nfails, so it is safe to gate an installer on.\n\nThe subtle half is the signature. `lm` will **not** tell you \"the signature is good\"\nunless you say whose it must be, because the DID inside `manifest.sig` is not evidence of\nanything: whoever replaced the signature replaced that DID beside it. This doc-test ends\nby relabelling a package to show exactly that \u2014 a directory that passes `verify` until\nyou name a signer, and fails the moment you do.\n\n**What you'll build:** A signed `greeter.lgx`, installed into a module directory the way a package manager would, then verified \u2014 intact, tampered with, and relabelled.\n\n**What you'll learn:**\n\n- What survives packaging into an installed directory, and how a package manager lays one out\n- How `lm verify` reports integrity, and what a modified payload file looks like\n- Why `--did` is the only way to get a signature verdict, and what pinning the wrong DID says\n- Why a relabelled package passes verification until you name the signer it should have\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- A Linux or macOS machine."}, {"execs": [], "md": "## Step 1: Build lm and lgx\n\nTwo tools: `lm` from this repository, and `lgx` \u2014 the package tool \u2014 from\nlogos-package, to produce something worth verifying. They are deliberately the two\nends of the same rules: `lgx` writes the hashes and the signature into a package, and\n`lm verify` checks them again once that package has been unpacked onto a machine.\n\n> The `{release}` in the `lm` URL is what pins the build to a specific commit: the\n> doc-test runner expands it to a concrete ref \u2014 this checkout's `HEAD` locally, the\n> commit under test in CI. `lgx` carries no `{release}` and so tracks logos-package's\n> `master` on purpose: `lm verify` is a thin shell over logos-package's checks, so if\n> those rules move, this doc-test *should* notice."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-module/eb7b3713e0f80c06313567363e22dd9a86d70814#lm' -o lm", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build lm\n\n```bash\n# From inside the clone this is simply: nix build '.#lm' -o lm\nnix build 'github:logos-co/logos-module/eb7b3713e0f80c06313567363e22dd9a86d70814#lm' -o lm\n```"}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-package#lgx' -o lgx", "exit_code": 0, "kind": "run", "note": "", "output": "this path will be fetched (270.8 KiB download, 708.2 KiB unpacked):\n  /nix/store/hbmjil8wjw5mrpxkxxmgkaqf2ym0dpx5-lgx-0.1.0\ncopying path '/nix/store/hbmjil8wjw5mrpxkxxmgkaqf2ym0dpx5-lgx-0.1.0' from 'https://logos-co.cachix.org'...\n", "status": "pass"}], "md": "### 1.2 Build lgx\n\n```bash\nnix build 'github:logos-co/logos-package#lgx' -o lgx\n```"}, {"execs": [{"cmd": "./lm/bin/lm --version\n./lgx/bin/lgx --version\n", "exit_code": 0, "kind": "run", "note": "", "output": "lm (Logos Module) version 0.1.0\nlgx version 0.1.0\n", "status": "pass"}], "md": "### 1.3 Confirm both run\n\n```bash\n./lm/bin/lm --version\n./lgx/bin/lgx --version\n\n```"}, {"execs": [], "md": "## Step 2: Package a module and sign it\n\nA package carries one payload tree per **variant** \u2014 `linux-x86_64`, `darwin-arm64`\nand so on. We build a single-variant package for this machine. The payload here is a\nstub rather than a compiled plugin, because verification never loads anything: it\nhashes bytes and checks a signature, which is exactly why it works the same on both\nplatforms. (Compiling and inspecting a real plugin is the\n[inspection doc-test](lm-inspect.md).)"}, {"execs": [{"cmd": "case \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   echo linux-x86_64  > variant.txt; echo so    > ext.txt ;;\n  \"Linux aarch64\")  echo linux-arm64   > variant.txt; echo so    > ext.txt ;;\n  \"Darwin arm64\")   echo darwin-arm64  > variant.txt; echo dylib > ext.txt ;;\n  \"Darwin x86_64\")  echo darwin-x86_64 > variant.txt; echo dylib > ext.txt ;;\n  *) echo \"unsupported platform: $(uname -sm)\" >&2; exit 1 ;;\nesac\ntest -s variant.txt && test -s ext.txt \\\n  && echo \"variant: $(cat variant.txt)  ext: $(cat ext.txt)\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "variant: darwin-arm64  ext: dylib\n", "status": "pass"}], "md": "### 2.1 Detect this machine's variant\n\nStash the variant name and the shared-library extension in two files; every step\nbelow re-reads them, so nothing further down has to know which platform it is on.\n\n```bash\ncase \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   echo linux-x86_64  > variant.txt; echo so    > ext.txt ;;\n  \"Linux aarch64\")  echo linux-arm64   > variant.txt; echo so    > ext.txt ;;\n  \"Darwin arm64\")   echo darwin-arm64  > variant.txt; echo dylib > ext.txt ;;\n  \"Darwin x86_64\")  echo darwin-x86_64 > variant.txt; echo dylib > ext.txt ;;\n  *) echo \"unsupported platform: $(uname -sm)\" >&2; exit 1 ;;\nesac\ntest -s variant.txt && test -s ext.txt \\\n  && echo \"variant: $(cat variant.txt)  ext: $(cat ext.txt)\"\n\n```"}, {"execs": [{"cmd": "V=\"$(cat variant.txt)\"; E=\"$(cat ext.txt)\"\nmkdir -p payload/lib\necho 'stub plugin' > \"payload/greeter_plugin.$E\"\necho 'stub helper' > \"payload/lib/libhelper.$E\"\n./lgx/bin/lgx create greeter\n./lgx/bin/lgx add greeter.lgx --variant \"$V\" --files payload --main \"greeter_plugin.$E\" -y\n", "exit_code": 0, "kind": "run", "note": "", "output": "Created package: greeter.lgx\nAdded variant 'darwin-arm64' to greeter.lgx\n", "status": "pass"}], "md": "### 2.2 Create the package\n\n`lgx add` takes a whole payload directory and the `main` inside it, records the\nentry point in the manifest's `main` map, and computes the content hashes over\neverything it stored.\n\n```bash\nV=\"$(cat variant.txt)\"; E=\"$(cat ext.txt)\"\nmkdir -p payload/lib\necho 'stub plugin' > \"payload/greeter_plugin.$E\"\necho 'stub helper' > \"payload/lib/libhelper.$E\"\nlgx create greeter\nlgx add greeter.lgx --variant \"$V\" --files payload --main \"greeter_plugin.$E\" -y\n```"}, {"execs": [{"cmd": "./lgx/bin/lgx keygen --name publisher --output-dir ./keys\ncp ./keys/publisher.did publisher-did.txt\n./lgx/bin/lgx sign greeter.lgx --key publisher --keys-dir ./keys --name \"Logos Demo\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ilo0Vl9ZMDl6RzBfV0tPYkg0by1KRDhDZHhLT2U5Wk8xaUhtdFVRQXFJcHcifQ\nKeypair generated: ./keys/publisher.{jwk,pub,did}\nPackage signed: greeter.lgx\nSigner DID: did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ilo0Vl9ZMDl6RzBfV0tPYkg0by1KRDhDZHhLT2U5Wk8xaUhtdFVRQXFJcHcifQ\n", "status": "pass"}], "md": "### 2.3 Sign it\n\n`lgx keygen` writes an Ed25519 keypair and the `did:jwk:` DID that names its\npublic half; `lgx sign` writes a `manifest.sig` carrying that DID and a signature\nover the manifest's bytes. We keep the DID in a file \u2014 it is the thing we will\npin with later, and the whole point is that it comes from *us*, not from the\npackage.\n\n```bash\nlgx keygen --name publisher --output-dir ./keys\ncp ./keys/publisher.did publisher-did.txt   # every --did below re-reads this\nlgx sign greeter.lgx --key publisher --keys-dir ./keys --name \"Logos Demo\"\n```"}, {"execs": [], "md": "## Step 3: Install it the way a package manager does\n\nAn `.lgx` is a gzipped tar, so we can do the install by hand and see exactly what one\nis. A package manager takes three things out of the archive and drops them in a\ndirectory:\n\n```\nmodules/greeter/\n  manifest.json          # from the archive root, byte for byte\n  manifest.sig           # likewise \u2014 the signature is over those bytes\n  greeter_plugin.so      # variants/<this variant>/\u2026 flattened to the root\n  lib/libhelper.so\n  variant                # written by the installer: which variant was chosen\n```\n\nThe other variants are dropped on the floor. That is why the `variant` file has to be\nwritten: nothing else in the directory records which of the package's platforms this\ninstall actually is."}, {"execs": [{"cmd": "tar -tzf greeter.lgx", "exit_code": 0, "kind": "run", "note": "", "output": "manifest.json\nmanifest.sig\nvariants/\nvariants/darwin-arm64/\nvariants/darwin-arm64/greeter_plugin.dylib\nvariants/darwin-arm64/lib/\nvariants/darwin-arm64/lib/libhelper.dylib\n", "status": "pass"}], "md": "### 3.1 Look inside the archive\n\n```bash\ntar -tzf greeter.lgx\n```"}, {"execs": [{"cmd": "V=\"$(cat variant.txt)\"\nmkdir -p stage modules/greeter\ntar -xzf greeter.lgx -C stage\ncp stage/manifest.json stage/manifest.sig modules/greeter/\ncp -R \"stage/variants/$V/.\" modules/greeter/\necho \"$V\" > modules/greeter/variant\necho \"installed for $V:\"\n(cd modules/greeter && find . -type f | sort)\n", "exit_code": 0, "kind": "run", "note": "", "output": "installed for darwin-arm64:\n./greeter_plugin.dylib\n./lib/libhelper.dylib\n./manifest.json\n./manifest.sig\n./variant\n", "status": "pass"}], "md": "### 3.2 Unpack one variant into a module directory\n\n```bash\nV=\"$(cat variant.txt)\"\nmkdir -p stage modules/greeter\ntar -xzf greeter.lgx -C stage\ncp stage/manifest.json stage/manifest.sig modules/greeter/\ncp -R \"stage/variants/$V/.\" modules/greeter/\necho \"$V\" > modules/greeter/variant\n```"}, {"execs": [], "md": "## Step 4: Verify the install\n\n`lm verify` reports three things and then a verdict.\n\n**Integrity** re-hashes the installed files and compares them with the manifest's\nhashes \u2014 not only the variant's own subtree, but the package-wide entries too, so a\npackage with root-level assets has to come out right on both.\n\n**Signature** is `not checked` here, and says why: no DID was named. `lm` shows the\nDID `manifest.sig` *claims*, so a human can decide what to pin, and labels it as a\nclaim.\n\n**Findings** are the individual failures, and `RESULT` is the exit status in words."}, {"execs": [{"cmd": "./lm/bin/lm verify modules/greeter\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Verification:\n=============\nPath:       /private/tmp/doctest-test-5x027dnf/modules/greeter\nVariant:    darwin-arm64\nIntegrity:  ok \u2014 the installed files answer to the manifest's hashes for variant 'darwin-arm64'\nSignature:  not checked \u2014 pass --did to check it (manifest.sig claims did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ilo0Vl9ZMDl6RzBfV0tPYkg0by1KRDhDZHhLT2U5Wk8xaUhtdFVRQXFJcHcifQ)\nFindings:   none\n\nRESULT: pass\nexit: 0\n", "status": "pass"}], "md": "### 4.1 Verify the untouched install\n\n```bash\nlm verify modules/greeter\n```"}, {"execs": [], "md": "## Step 5: Name the signer you expect\n\n`--did` is how you ask the signature question, and it is deliberately the *only* way:\nthere is no flag that means \"is the signature good?\" without naming whose it must be.\nA signature only ever proves that *this* key signed *these* bytes, and the key has to\ncome from somewhere you trust \u2014 a keyring, a policy, a `dependencies` entry \u2014 never\nfrom the file being checked."}, {"execs": [{"cmd": "./lm/bin/lm verify modules/greeter --did \"$(cat publisher-did.txt)\"\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Verification:\n=============\nPath:       /private/tmp/doctest-test-5x027dnf/modules/greeter\nVariant:    darwin-arm64\nIntegrity:  ok \u2014 the installed files answer to the manifest's hashes for variant 'darwin-arm64'\nSignature:  ok \u2014 did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ilo0Vl9ZMDl6RzBfV0tPYkg0by1KRDhDZHhLT2U5Wk8xaUhtdFVRQXFJcHcifQ signed this manifest\nFindings:   none\n\nRESULT: pass\nexit: 0\n", "status": "pass"}], "md": "### 5.1 The right DID\n\n```bash\nlm verify modules/greeter --did \"$(cat publisher-did.txt)\"\n```"}, {"execs": [{"cmd": "./lgx/bin/lgx keygen --name someone-else --output-dir ./keys >/dev/null\n./lm/bin/lm verify modules/greeter --did \"$(cat ./keys/someone-else.did)\"\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Verification:\n=============\nPath:       /private/tmp/doctest-test-5x027dnf/modules/greeter\nVariant:    darwin-arm64\nIntegrity:  ok \u2014 the installed files answer to the manifest's hashes for variant 'darwin-arm64'\nSignature:  MISMATCH \u2014 did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6IkwxbUkzbU1ZNE5PZ0tCQVRobFdfc3VjUGgxN1FVZ3BwNHFnXzc5MlJGYWsifQ did not sign these bytes (manifest.sig claims did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ilo0Vl9ZMDl6RzBfV0tPYkg0by1KRDhDZHhLT2U5Wk8xaUhtdFVRQXFJcHcifQ)\nFindings:   none\n\nRESULT: FAIL\nexit: 1\n", "status": "pass"}], "md": "### 5.2 Somebody else's DID\n\nGenerate a second, unrelated key and pin that instead. The package is untouched\nand its integrity is still fine \u2014 it simply is not from the publisher we asked\nfor, and that is a failure.\n\n```bash\nlgx keygen --name someone-else --output-dir ./keys\nlm verify modules/greeter --did \"$(cat ./keys/someone-else.did)\"\n```"}, {"execs": [{"cmd": "./lm/bin/lm verify modules/greeter --did \"did:jwk:not-a-key\"\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Verification:\n=============\nPath:       /private/tmp/doctest-test-5x027dnf/modules/greeter\nVariant:    darwin-arm64\nIntegrity:  ok \u2014 the installed files answer to the manifest's hashes for variant 'darwin-arm64'\nSignature:  bad --did \u2014 'did:jwk:not-a-key' is not a did:jwk carrying an Ed25519 key\nFindings:   none\n\nRESULT: FAIL\nexit: 1\n", "status": "pass"}], "md": "### 5.3 A DID that is not a key at all\n\nA malformed `--did` is reported as a fault in the *question*, not an answer about\nthe package \u2014 you have not learned anything about this signature, so it does not\npass.\n\n```bash\nlm verify modules/greeter --did \"did:jwk:not-a-key\"\n```"}, {"execs": [], "md": "## Step 6: Tamper with the payload\n\nAppend a byte to an installed file \u2014 the sort of thing a bad patch, a partial\ndownload or a hostile edit produces \u2014 and the hashes stop agreeing. Note which check\nmoves: **integrity** fails, while the **signature** is still perfectly valid, because\nthe signature is over `manifest.json` and the manifest is what was not touched. The\ntwo checks answer different questions and the report keeps them apart."}, {"execs": [{"cmd": "E=\"$(cat ext.txt)\"\ncp -R modules/greeter modules/tampered\nprintf 'x' >> \"modules/tampered/lib/libhelper.$E\"\n./lm/bin/lm verify modules/tampered --did \"$(cat publisher-did.txt)\"\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Verification:\n=============\nPath:       /private/tmp/doctest-test-5x027dnf/modules/tampered\nVariant:    darwin-arm64\nIntegrity:  MISMATCH \u2014 installed content does not match manifest hashes\nSignature:  ok \u2014 did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ilo0Vl9ZMDl6RzBfV0tPYkg0by1KRDhDZHhLT2U5Wk8xaUhtdFVRQXFJcHcifQ signed this manifest\nFindings:   1\n  - Content hash mismatch: installed content does not match manifest hashes\n\nRESULT: FAIL\nexit: 1\n", "status": "pass"}], "md": "### 6.1 Modify an installed file\n\n```bash\ncp -R modules/greeter modules/tampered\nprintf 'x' >> \"modules/tampered/lib/libhelper.$(cat ext.txt)\"\nlm verify modules/tampered --did \"$(cat publisher-did.txt)\"\n```"}, {"execs": [{"cmd": "./lm/bin/lm verify modules/tampered --json\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\n    \"errors\": [\n        \"Content hash mismatch: installed content does not match manifest hashes\"\n    ],\n    \"integrity\": \"mismatch\",\n    \"integrity_detail\": \"installed content does not match manifest hashes\",\n    \"path\": \"/private/tmp/doctest-test-5x027dnf/modules/tampered\",\n    \"ran\": true,\n    \"signature\": {\n        \"claimed_did\": \"did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ilo0Vl9ZMDl6RzBfV0tPYkg0by1KRDhDZHhLT2U5Wk8xaUhtdFVRQXFJcHcifQ\",\n        \"present\": true,\n        \"state\": \"not_checked\"\n    },\n    \"valid\": false,\n    \"variant\": \"darwin-arm64\",\n    \"warnings\": [\n    ]\n}\nexit: 1\n", "status": "pass"}], "md": "### 6.2 The same verdict for a script\n\n`--json` replaces the `RESULT:` line but not the exit status, so a script gates on\nthe same verdict a human reads. Note `signature.state` here: this run named no\nDID, so the signature was not checked \u2014 `\"claimed_did\"` is reported beside it and\nlabelled as a claim, never as a `signer`.\n\n```bash\nlm verify modules/tampered --json\n```"}, {"execs": [], "md": "## Step 7: Relabel the package\n\nThis is the case the `--did` design exists for. Edit `manifest.json` \u2014 bump the\nversion, rename the module, whatever a repackager would do \u2014 and leave `manifest.sig`\nexactly where it is. Nobody touched the payload, so the content hashes still agree,\nand `manifest.sig` still names the original publisher's DID.\n\nRun `verify` with no `--did` and it **passes**. Everything it was asked about is\nfine. The signature was never checked, because nothing said which key it had to be \u2014\nand taking that key from `manifest.sig` would prove nothing, since the DID sitting in\nthat file is written by whoever wrote the file.\n\nName the publisher's DID and the same directory fails immediately: those manifest\nbytes are not the ones that key signed."}, {"execs": [{"cmd": "cp -R modules/greeter modules/relabelled\nsed 's/\"version\": \"0.0.1\"/\"version\": \"9.9.9\"/' modules/greeter/manifest.json \\\n  > modules/relabelled/manifest.json\ngrep -q '\"version\": \"9.9.9\"' modules/relabelled/manifest.json && echo \"manifest relabelled to 9.9.9\"\ncmp -s modules/greeter/manifest.sig modules/relabelled/manifest.sig && echo \"manifest.sig untouched\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "manifest relabelled to 9.9.9\nmanifest.sig untouched\n", "status": "pass"}], "md": "### 7.1 Rewrite the manifest, keep the signature\n\n```bash\ncp -R modules/greeter modules/relabelled\nsed 's/\"version\": \"0.0.1\"/\"version\": \"9.9.9\"/' modules/greeter/manifest.json \\\n  > modules/relabelled/manifest.json\n```"}, {"execs": [{"cmd": "./lm/bin/lm verify modules/relabelled\necho \"without --did, exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Verification:\n=============\nPath:       /private/tmp/doctest-test-5x027dnf/modules/relabelled\nVariant:    darwin-arm64\nIntegrity:  ok \u2014 the installed files answer to the manifest's hashes for variant 'darwin-arm64'\nSignature:  not checked \u2014 pass --did to check it (manifest.sig claims did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ilo0Vl9ZMDl6RzBfV0tPYkg0by1KRDhDZHhLT2U5Wk8xaUhtdFVRQXFJcHcifQ)\nFindings:   none\n\nRESULT: pass\nwithout --did, exit: 0\n", "status": "pass"}], "md": "### 7.2 It passes, until you ask\n\n```bash\nlm verify modules/relabelled\n```"}, {"execs": [{"cmd": "./lm/bin/lm verify modules/relabelled --did \"$(cat publisher-did.txt)\"\necho \"with --did, exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Verification:\n=============\nPath:       /private/tmp/doctest-test-5x027dnf/modules/relabelled\nVariant:    darwin-arm64\nIntegrity:  ok \u2014 the installed files answer to the manifest's hashes for variant 'darwin-arm64'\nSignature:  MISMATCH \u2014 did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ilo0Vl9ZMDl6RzBfV0tPYkg0by1KRDhDZHhLT2U5Wk8xaUhtdFVRQXFJcHcifQ did not sign these bytes (manifest.sig claims did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ilo0Vl9ZMDl6RzBfV0tPYkg0by1KRDhDZHhLT2U5Wk8xaUhtdFVRQXFJcHcifQ)\nFindings:   none\n\nRESULT: FAIL\nwith --did, exit: 1\n", "status": "pass"}], "md": "### 7.3 Pin the publisher and it fails\n\nThe DID `manifest.sig` claims has not changed \u2014 it is still the publisher's. Only\nthe bytes it was supposed to cover have. Had `lm` used the claimed DID as the key\nto check against, a repackager would only have had to swap in their own signature\n*and* their own DID, and this directory would have verified.\n\n```bash\nlm verify modules/relabelled --did \"$(cat publisher-did.txt)\"\n```"}, {"execs": [], "md": "## Step 8: What verify refuses\n\nBoth refusals keep the two shapes of path apart. `verify`'s checks are over\n`manifest.json` and the files it covers, so there is nothing for it to do to a bare\nplugin; and `--did` names whose signature to check, which is a question only `verify`\nanswers."}, {"execs": [{"cmd": "E=\"$(cat ext.txt)\"\n./lm/bin/lm verify \"modules/greeter/greeter_plugin.$E\"\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Error: verify takes an installed module directory; modules/greeter/greeter_plugin.dylib is a file\n  The checks are over manifest.json and the files it covers, and a bare plugin has neither.\nexit: 1\n", "status": "pass"}], "md": "### 8.1 verify on a plugin file\n\n```bash\nlm verify \"modules/greeter/greeter_plugin.$(cat ext.txt)\"\n```"}, {"execs": [{"cmd": "./lm/bin/lm metadata modules/greeter --did \"$(cat publisher-did.txt)\"\necho \"exit: $?\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Error: --did names whose signature to check, which only `lm verify` does\nexit: 1\n", "status": "pass"}], "md": "### 8.2 --did on a command that is not verify\n\n```bash\nlm metadata modules/greeter --did \"$(cat publisher-did.txt)\"\n```"}, {"execs": [], "md": "## Recap\n\nYou packaged and signed a module with `lgx`, installed it by hand the way a package\nmanager would, and put `lm verify` through every verdict it has:\n\n| What you ran | Integrity | Signature | Exit |\n|---|---|---|---|\n| untouched install | `ok` | `not checked` \u2014 no DID named | `0` |\n| `--did` the publisher's | `ok` | `ok` | `0` |\n| `--did` someone else's | `ok` | `MISMATCH` | `1` |\n| `--did` a malformed DID | `ok` | `bad --did` | `1` |\n| a modified payload file | `MISMATCH` | `ok` | `1` |\n| a relabelled manifest, no `--did` | `ok` | `not checked` | `0` |\n| a relabelled manifest, `--did` pinned | `ok` | `MISMATCH` | `1` |\n\nThe last two rows are the lesson. Integrity is self-contained \u2014 the manifest carries\nthe hashes and the payload either answers to them or does not. Authenticity is not:\nit needs a key from outside the package, and the only place `lm` will take one from\nis your `--did`.\n\nReading a module \u2014 its metadata, its API, and the four ways an install can fail to\nname a plugin \u2014 is the companion [inspection doc-test](lm-inspect.md)."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
